name: Playwright Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright e2e once, even when RUN_E2E is disabled"
        required: false
        type: boolean
        default: false
jobs:
  test:
    # Disabled by default while the suite is split into resource-safe shards.
    # Re-enable on push/PR by setting the repository variable RUN_E2E=true.
    # For a one-off manual run, use Actions > Playwright Tests > Run workflow > run_e2e=true.
    if: ${{ vars.RUN_E2E == 'true' || inputs.run_e2e == true }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: dev
    container:
      image: mcr.microsoft.com/playwright:v1.43.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install git
        run: apt-get update && apt-get install -y git
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Sin `version`, action-setup toma la de `packageManager` en package.json. Con `latest`, CI
      # usaba una pnpm distinta a la de desarrollo y podía resolver dependencias de otra forma.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        env:
          HOME: /root
          NODE_ENV: development
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_TRUST_HOST: ${{ secrets.AUTH_TRUST_HOST }}
          CJ_AUTH_PATH: ${{ secrets.CJ_AUTH_PATH }}
          # Sin esta clave, publicar y editar dejan el vector y la traducción pendientes —el
          # registro se llenaba de `GEMINI_API_KEY is not configured`— y los escenarios de
          # indexación se saltan solos (`test.skip`). Tenerla en el repositorio no bastaba: el
          # trabajo solo ve las variables que este bloque nombra.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # La otra mitad de esos escenarios: publican como administrador. Sin la lista de correos
          # se siguen saltando, aunque la clave de Gemini ya esté.
          HAZLO_SANO_ADMIN_EMAILS: ${{ secrets.HAZLO_SANO_ADMIN_EMAILS }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOM }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          DB_PROVIDER: ${{ vars.DB_PROVIDER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
