name: Playwright Tests

on:
  push:
    branches: [main, dev, master]
  pull_request:
    branches: [main, dev, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.dev -t devSaludJustaImage .

      - name: Run Docker container with environment variables
        run: |
          docker run -d -p 3000:3000 \
          -e STORAGE_BUCKET=${{ secrets.STORAGE_BUCKET }} \
          -e FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }} \
          -e AUTH_URL=${{ secrets.AUTH_URL }} \
          -e AUTH_SECRET=${{ secrets.AUTH_SECRET }} \
          -e AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }} \
          -e AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }} \
          --name  devSaludJustaContainer devSaludJustaImage

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000

      - name: Install Playwright Browsers
        run: docker exec devSaludJustaContainer npx playwright install --with-deps

      - name: Run Playwright tests
        run: docker exec devSaludJustaContainer npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop and remove Docker container
        run: docker stop devSaludJustaContainer && docker rm devSaludJustaContainer
